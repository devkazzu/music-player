name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment, without cancelling an in-flight release.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Project sites live at https://<user>.github.io/<repo>/, so every asset
      # and the router basename must be built against that sub-path.
      - name: Build for the Pages sub-path
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm run build
          node scripts/check-pwa.mjs dist

      # Prefer artifact deployments: legacy "deploy from a branch" builds would
      # publish the repository root instead of dist/ and race with this job.
      - name: Switch Pages to GitHub Actions deployments
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request('PUT /repos/{owner}/{repo}/pages', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: 'workflow',
              });
              core.info('Pages build_type is now "workflow".');
            } catch (error) {
              core.warning(`Could not switch Pages build_type automatically: ${error.message}`);
              core.notice('Set Settings → Pages → Source to "GitHub Actions" once.');
            }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
